<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MN Legit Cannabis – South Metro Menu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:   #2d6a4f;
      --lt:      #52b788;
      --gold:    #d4a017;
      --bg:      #0e1a12;
      --card:    #1c2e20;
      --text:    #d8f3dc;
      --muted:   #74c69d;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a3d25 0%, #0e2016 100%);
      border-bottom: 2px solid var(--lt);
      padding: 24px 28px 16px;
      position: sticky; top: 0; z-index: 20;
    }
    header h1 { font-size: 1.8rem; color: #fff; letter-spacing: .5px; }
    header h1 span { color: var(--lt); }
    .meta { display: flex; gap: 20px; margin-top: 6px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
    .meta strong { color: var(--lt); }
    .legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: .76rem; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .fbtn {
      background: #1a3020; border: 1px solid #2a4030; color: var(--lt);
      padding: 5px 13px; border-radius: 20px; cursor: pointer; font-size: .78rem;
      transition: background .15s, border-color .15s;
    }
    .fbtn:hover, .fbtn.on { background: var(--lt); color: #0e1a12; border-color: var(--lt); }

    /* ── Main ── */
    main { max-width: 1400px; margin: 0 auto; padding: 28px 18px 60px; }
    .cat-section { margin-bottom: 44px; }
    .cat-title {
      font-size: 1.2rem; color: var(--lt);
      border-bottom: 1px solid #2a4030; padding-bottom: 9px; margin-bottom: 18px;
      display: flex; align-items: center; gap: 9px;
    }
    .cat-count { font-size: .8rem; color: var(--muted); font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }

    /* ── Card ── */
    .card {
      background: var(--card); border: 1px solid #2a4030; border-radius: 12px;
      overflow: hidden; position: relative;
      transition: transform .15s, border-color .15s;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--lt); }
    .badge {
      position: absolute; top: 9px; right: 9px;
      padding: 3px 9px; border-radius: 20px;
      font-size: .68rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; z-index: 2;
    }
    .badge-new    { background: var(--lt);  color: #0e1a12; }
    .badge-recent { background: var(--gold); color: #0e1a12; }
    .thumb {
      width: 100%; height: 150px; object-fit: cover; background: #111;
      display: block;
    }
    .placeholder {
      width: 100%; height: 110px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; background: #131f16; border-bottom: 1px solid #2a4030;
    }
    .body { padding: 12px 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .name  { font-size: .92rem; font-weight: 600; color: #fff; line-height: 1.3; }
    .brand { font-size: .75rem; color: var(--muted); }
    .stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; }
    .stat  { font-size: .69rem; background: #1a3020; color: var(--lt); padding: 2px 7px; border-radius: 10px; }
    .desc  { font-size: .72rem; color: #8db89a; line-height: 1.4; margin-top: 3px; }
    .price { margin-top: auto; padding-top: 9px; font-size: 1.05rem; font-weight: 700; color: var(--gold); }

    footer { text-align: center; padding: 22px; font-size: .73rem; color: #3d6b4a; border-top: 1px solid #1e3025; }
    .hidden { display: none !important; }

    @media (max-width: 580px) {
      header { position: relative; }
      header h1 { font-size: 1.3rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); }
    }
  </style>
</head>
<body>
<header>
  <h1>🌿 MN Legit Cannabis – <span>South Metro</span></h1>
  <div class="meta">
    <span>Updated: <strong id="ts">—</strong></span>
    <span>In stock: <strong id="cnt">—</strong></span>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="badge badge-new" style="position:static">NEW TODAY</span>Added today</div>
    <div class="legend-item"><span class="badge badge-recent" style="position:static">NEW (2d)</span>Within 3 days</div>
  </div>
  <div class="filter-bar" id="filters">
    <button class="fbtn on" data-cat="all">All</button>
  </div>
</header>

<main id="main"><p style="color:var(--muted);padding:60px 0;text-align:center">Loading…</p></main>

<footer>Auto-updated daily at 4:30 PM CST &nbsp;·&nbsp; MN Legit Cannabis South Metro</footer>

<script>
const CST_OFF = -6 * 60, NEW_DAYS = 3;
const nowCST  = () => { const d=new Date(); return new Date(d.getTime()+d.getTimezoneOffset()*60000+CST_OFF*60000); };
const ageDays = s => { try { return Math.floor((nowCST()-new Date(s))/86400000); } catch{ return 999; } };
const badge   = s => {
  const d = ageDays(s);
  if (d===0) return `<span class="badge badge-new">NEW TODAY</span>`;
  if (d<=NEW_DAYS) return `<span class="badge badge-recent">NEW (${d}d)</span>`;
  return '';
};
const ICONS = {flower:'🌿','pre-roll':'🚬',pre_roll:'🚬',edible:'🍬',edibles:'🍬',
  concentrate:'💎',concentrates:'💎',vape:'💨',vapes:'💨',cartridge:'💨',
  tincture:'💧',tinctures:'💧',topical:'🧴',topicals:'🧴',capsule:'💊',capsules:'💊',
  accessory:'🛠️',accessories:'🛠️'};
const icon = c => ICONS[(c||'').toLowerCase().trim()] || '🌱';

function card(p) {
  const img = p.image
    ? `<img class="thumb" src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">`
    : `<div class="placeholder">${icon(p.category)}</div>`;
  const stats = [
    p.thc    ? `<span class="stat">THC ${p.thc}</span>` : '',
    p.cbd    ? `<span class="stat">CBD ${p.cbd}</span>` : '',
    p.weight ? `<span class="stat">${p.weight}</span>`  : '',
  ].join('');
  let price = p.price||'';
  if (typeof price==='number') price=`$${price.toFixed(2)}`;
  return `<div class="card">
    ${badge(p.first_seen)}${img}
    <div class="body">
      <div class="name">${p.name}</div>
      ${p.brand?`<div class="brand">${p.brand}</div>`:''}
      <div class="stats">${stats}</div>
      ${p.description?`<div class="desc">${p.description.slice(0,110)}${p.description.length>110?'…':''}</div>`:''}
      <div class="price">${price}</div>
    </div></div>`;
}

async function load() {
  const resp = await fetch('products.json?_='+Date.now());
  const db   = await resp.json();
  const now  = nowCST();

  document.getElementById('ts').textContent =
    now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+
    ' — '+now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})+' CST';

  const all = Object.values(db.products||{}).filter(p=>p.in_stock!==false);
  document.getElementById('cnt').textContent = all.length+' products';

  // Sort new-first, then alpha
  all.sort((a,b)=>{
    const da=ageDays(a.first_seen), db2=ageDays(b.first_seen);
    return da!==db2 ? da-db2 : (a.name||'').localeCompare(b.name||'');
  });

  // Group by category
  const cats = {};
  all.forEach(p=>{ const c=p.category||'Other'; (cats[c]=cats[c]||[]).push(p); });

  // Filter buttons
  const bar = document.getElementById('filters');
  Object.keys(cats).sort().forEach(c=>{
    const b=document.createElement('button');
    b.className='fbtn'; b.dataset.cat=c.toLowerCase(); b.textContent=`${icon(c)} ${c}`;
    bar.appendChild(b);
  });
  bar.addEventListener('click', e=>{
    if (!e.target.matches('.fbtn')) return;
    bar.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
    e.target.classList.add('on');
    const sel=e.target.dataset.cat;
    document.querySelectorAll('.cat-section').forEach(s=>{
      s.classList.toggle('hidden', sel!=='all' && s.dataset.cat!==sel);
    });
  });

  // Build sections
  const main=document.getElementById('main');
  main.innerHTML='';
  Object.entries(cats).sort().forEach(([c,items])=>{
    const sec=document.createElement('section');
    sec.className='cat-section'; sec.dataset.cat=c.toLowerCase();
    sec.innerHTML=`<h2 class="cat-title">${icon(c)} ${c} <span class="cat-count">(${items.length})</span></h2>
      <div class="grid">${items.map(card).join('')}</div>`;
    main.appendChild(sec);
  });
}

load().catch(e=>{
  document.getElementById('main').innerHTML=
    `<p style="color:#e63946;padding:40px 0;text-align:center">Could not load menu: ${e.message}</p>`;
});
</script>
</body>
</html>
