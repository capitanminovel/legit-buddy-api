name: Daily Menu Scrape

on:
  schedule:
    # 4:30 PM CST = 22:30 UTC  (change to 21:30 during CDT / summer)
    - cron: '30 22 * * *'
  workflow_dispatch:   # click "Run workflow" in GitHub any time

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml playwright

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Build static HTML from scraped data
        run: python build_preview.py

      - name: Commit updated data
        run: |
          git config user.name  "Legit Buddy Bot"
          git config user.email "actions@github.com"
          git add docs/products.json docs/index.html docs/sweed_raw.json 2>/dev/null || true
          git add docs/products.json docs/index.html
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "🌿 Menu update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD
