<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain's Terps Grows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0c0a07;
      --surface:      #161310;
      --card:         #1e1a14;
      --card-hover:   #27221a;
      --border:       #332c22;
      --border-hi:    #4a4030;

      --text:         #ecdfc4;
      --muted:        #9e8c68;
      --faint:        #5e5038;

      --gold:         #c8a44c;
      --gold-hi:      #e0be70;
      --gold-dim:     #7a6228;

      --green:        #5c8050;
      --green-hi:     #78a868;

      --cured-bg:     #1a2c08; --cured-fg:    #a8cc48;
      --growlog-bg:   #2c1e06; --growlog-fg:  #e0a030;
      --active-bg:    #082c18; --active-fg:   #38c868;
      --vault-bg:     #221a0e; --vault-fg:    #c09660;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    header {
      background: linear-gradient(180deg, #09070400 0%, var(--surface) 100%),
                  linear-gradient(135deg, #0c0905 0%, #1a1410 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.4rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; flex-direction: column; gap: 2px; }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      color: var(--gold-hi);
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    .brand-tagline {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .header-actions { display: flex; gap: 0.65rem; align-items: center; }

    /* ── BUTTONS ────────────────────────────────────────── */
    .btn {
      padding: 0.45rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.15s ease;
      line-height: 1.4;
    }

    .btn-primary { background: var(--gold); color: #0c0a07; }
    .btn-primary:hover { background: var(--gold-hi); }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-hi);
      color: var(--muted);
    }
    .btn-outline:hover { border-color: var(--gold-dim); color: var(--gold); }

    .btn-danger {
      background: #2c1010;
      border: 1px solid #5a2828;
      color: #d06060;
    }
    .btn-danger:hover { background: #3c1818; }

    .btn-generate {
      padding: 0.7rem 1.6rem;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: #0c0a07;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-generate:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(200, 164, 76, 0.3);
    }
    .btn-generate:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── FILTER BAR ─────────────────────────────────────── */
    .filter-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 2rem;
      display: flex;
      gap: 0.45rem;
      align-items: center;
      overflow-x: auto;
    }

    .filter-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--faint);
      margin-right: 0.2rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .filter-btn {
      padding: 0.3rem 0.85rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.76rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn:hover { border-color: var(--border-hi); color: var(--text); }
    .filter-btn.active { background: var(--card); border-color: var(--gold-dim); color: var(--gold); }

    .filter-btn[data-filter="Active"].active    { background: var(--active-bg);  border-color: var(--active-fg);  color: var(--active-fg); }
    .filter-btn[data-filter="Grow Log"].active  { background: var(--growlog-bg); border-color: var(--growlog-fg); color: var(--growlog-fg); }
    .filter-btn[data-filter="Cured"].active     { background: var(--cured-bg);   border-color: var(--cured-fg);   color: var(--cured-fg); }
    .filter-btn[data-filter="Vault"].active     { background: var(--vault-bg);   border-color: var(--vault-fg);   color: var(--vault-fg); }

    .strain-count-badge {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 0.65rem;
      color: var(--faint);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
    }

    /* ── MAIN / GRID ────────────────────────────────────── */
    main {
      padding: 1.75rem 2rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .strain-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1rem;
    }

    /* ── STRAIN CARD ────────────────────────────────────── */
    .strain-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem 1.1rem;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .strain-card:hover {
      background: var(--card-hover);
      border-color: var(--border-hi);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }

    .card-name {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--text);
      line-height: 1.3;
    }

    .card-breeder {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-top: 2px;
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.55rem;
      border-radius: 10px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-tag.Cured    { background: var(--cured-bg);   color: var(--cured-fg);   }
    .status-tag.Grow-Log { background: var(--growlog-bg); color: var(--growlog-fg); }
    .status-tag.Active   { background: var(--active-bg);  color: var(--active-fg);  }
    .status-tag.Vault    { background: var(--vault-bg);   color: var(--vault-fg);   }

    .card-notes {
      font-size: 0.74rem;
      color: var(--muted);
      font-style: italic;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
    }

    .card-footer { display: flex; justify-content: space-between; align-items: center; }

    .card-date {
      font-size: 0.65rem;
      color: var(--faint);
      font-family: 'JetBrains Mono', monospace;
    }

    .card-researched {
      font-size: 0.62rem;
      color: var(--green-hi);
      display: flex;
      align-items: center;
      gap: 3px;
      letter-spacing: 0.04em;
    }

    /* ── MODAL OVERLAY ──────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.hidden { display: none; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 14px;
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.65);
    }

    .modal-header {
      padding: 1.4rem 1.6rem 1.1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .modal-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }

    .modal-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--text);
      line-height: 1.2;
    }

    .modal-breeder {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 3px;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--faint);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0.2rem;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .modal-close:hover { color: var(--text); }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .status-update-group { display: flex; align-items: center; gap: 0.45rem; }

    select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border-hi);
      border-radius: 6px;
      padding: 0.3rem 0.7rem;
      font-size: 0.78rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    select:focus { outline: 1px solid var(--gold-dim); }

    /* ── RESEARCH TABS ──────────────────────────────────── */
    .research-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
      background: var(--surface);
      padding: 0 1rem;
      scrollbar-width: none;
    }
    .research-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      padding: 0.7rem 0.9rem;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── MODAL BODY ─────────────────────────────────────── */
    .modal-body { overflow-y: auto; flex: 1; min-height: 0; }

    .research-panel { padding: 1.5rem 1.6rem; display: none; }
    .research-panel.active { display: block; }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--gold-hi);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .research-text {
      color: var(--text);
      line-height: 1.8;
      font-size: 0.88rem;
    }

    .research-meta {
      margin-top: 1.2rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 0.66rem;
      color: var(--faint);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── GENERATE PANEL ─────────────────────────────────── */
    .generate-panel {
      padding: 3rem 1.6rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    .generate-glyph { font-size: 2.4rem; opacity: 0.45; }

    .generate-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      color: var(--muted);
    }

    .generate-desc {
      font-size: 0.82rem;
      color: var(--faint);
      max-width: 380px;
      line-height: 1.6;
    }

    /* ── LOADING ────────────────────────────────────────── */
    .loading-panel {
      padding: 3.5rem 1.6rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text  { color: var(--muted); font-size: 0.88rem; }
    .loading-sub   { color: var(--faint); font-size: 0.76rem; }

    /* ── NOTES TAB ──────────────────────────────────────── */
    .notes-panel { padding: 1.5rem 1.6rem; }

    .notes-textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.86rem;
      font-family: 'Inter', sans-serif;
      padding: 0.75rem 0.9rem;
      resize: vertical;
      min-height: 120px;
      line-height: 1.65;
    }
    .notes-textarea:focus { outline: 1px solid var(--gold-dim); border-color: var(--gold-dim); }
    .notes-textarea::placeholder { color: var(--faint); }

    .notes-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.7rem; }

    /* ── ADD STRAIN MODAL ───────────────────────────────── */
    .add-modal-box { max-width: 460px; }

    .modal-form-body {
      padding: 1.4rem 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }

    .form-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 500;
    }

    .form-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      padding: 0.55rem 0.85rem;
    }
    .form-input:focus { outline: 1px solid var(--gold-dim); border-color: var(--gold-dim); }
    .form-input::placeholder { color: var(--faint); }

    .modal-form-footer {
      padding: 0.9rem 1.6rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }

    /* ── EMPTY STATE ────────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
    }
    .empty-glyph { font-size: 2.2rem; opacity: 0.35; margin-bottom: 0.75rem; }
    .empty-text  { font-size: 0.85rem; color: var(--faint); }

    /* ── FOOTER ─────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.4rem 2rem;
      text-align: center;
      margin-top: 1rem;
    }
    .footer-text {
      font-size: 0.68rem;
      color: var(--faint);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .sep { display: inline-block; margin: 0 0.45rem; opacity: 0.4; }

    /* ── TOAST ──────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--card-hover);
      border: 1px solid var(--border-hi);
      color: var(--text);
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: opacity 0.3s ease;
    }
    .toast.hidden { opacity: 0; pointer-events: none; }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 640px) {
      header { padding: 1rem; }
      .brand-name { font-size: 1.25rem; }
      main { padding: 1rem 1rem 2.5rem; }
      .filter-bar { padding: 0.6rem 1rem; }
      .strain-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
      .modal-box { max-height: 95vh; }
      .modal-name { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">Captain's Terps Grows</div>
    <div class="brand-tagline">Craft &middot; Solventless &middot; Living</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openAddModal()">+ Add Strain</button>
  </div>
</header>

<div class="filter-bar">
  <span class="filter-label">Filter</span>
  <button class="filter-btn active" data-filter="all"      onclick="setFilter('all', this)">All</button>
  <button class="filter-btn"        data-filter="Active"   onclick="setFilter('Active', this)">Active</button>
  <button class="filter-btn"        data-filter="Grow Log" onclick="setFilter('Grow Log', this)">Grow Log</button>
  <button class="filter-btn"        data-filter="Cured"    onclick="setFilter('Cured', this)">Cured</button>
  <button class="filter-btn"        data-filter="Vault"    onclick="setFilter('Vault', this)">Vault</button>
  <span class="strain-count-badge" id="strain-count"></span>
</div>

<main>
  <div class="strain-grid" id="strain-grid">
    <div class="empty-state">
      <div class="empty-glyph">🌱</div>
      <div class="empty-text">Loading strains…</div>
    </div>
  </div>
</main>

<!-- ── DETAIL MODAL ───────────────────────────────────────── -->
<div class="modal-overlay hidden" id="detail-modal">
  <div class="modal-box">

    <div class="modal-header">
      <div class="modal-header-row">
        <div>
          <div class="modal-name"    id="modal-name"></div>
          <div class="modal-breeder" id="modal-breeder"></div>
        </div>
        <button class="modal-close" onclick="closeDetailModal()">✕</button>
      </div>
      <div class="modal-controls">
        <span id="modal-status-tag" class="status-tag"></span>
        <div class="status-update-group">
          <select id="modal-status-select">
            <option value="Active">Active</option>
            <option value="Grow Log">Grow Log</option>
            <option value="Cured">Cured</option>
            <option value="Vault">Vault</option>
          </select>
          <button class="btn btn-outline" onclick="updateStatus()">Update</button>
        </div>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>

    <div class="research-tabs hidden" id="research-tabs">
      <button class="tab-btn active" data-tab="genetics" onclick="switchTab('genetics',this)">🧬 Genetics</button>
      <button class="tab-btn" data-tab="terpenes"        onclick="switchTab('terpenes',this)">🌿 Terpenes</button>
      <button class="tab-btn" data-tab="effects"         onclick="switchTab('effects',this)">✨ Effects</button>
      <button class="tab-btn" data-tab="flavor"          onclick="switchTab('flavor',this)">👃 Flavor & Aroma</button>
      <button class="tab-btn" data-tab="grow"            onclick="switchTab('grow',this)">🪴 Grow Notes</button>
      <button class="tab-btn" data-tab="rosin"           onclick="switchTab('rosin',this)">🍯 Rosin</button>
      <button class="tab-btn" data-tab="notes"           onclick="switchTab('notes',this)">📝 My Notes</button>
    </div>

    <div class="modal-body" id="modal-body"></div>

  </div>
</div>

<!-- ── ADD STRAIN MODAL ───────────────────────────────────── -->
<div class="modal-overlay hidden" id="add-modal">
  <div class="modal-box add-modal-box">
    <div class="modal-header">
      <div class="modal-header-row">
        <div class="modal-name" style="font-size:1.3rem">Add New Strain</div>
        <button class="modal-close" onclick="closeAddModal()">✕</button>
      </div>
    </div>
    <form id="add-form" onsubmit="submitAddStrain(event)">
      <div class="modal-form-body">
        <div class="form-group">
          <label class="form-label">Strain Name *</label>
          <input class="form-input" type="text" name="name" placeholder="e.g. Triangle Kush" required>
        </div>
        <div class="form-group">
          <label class="form-label">Breeder *</label>
          <input class="form-input" type="text" name="breeder" placeholder="e.g. Archive Seed Bank" required>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-input" name="status">
            <option value="Vault">Vault</option>
            <option value="Active">Active</option>
            <option value="Grow Log">Grow Log</option>
            <option value="Cured">Cured</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-input notes-textarea" name="notes"
            placeholder="Cross info, pheno notes, acquisition source…"
            style="min-height:80px; resize:vertical"></textarea>
        </div>
      </div>
      <div class="modal-form-footer">
        <button type="button" class="btn btn-outline" onclick="closeAddModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Strain</button>
      </div>
    </form>
  </div>
</div>

<!-- ── TOAST ──────────────────────────────────────────────── -->
<div class="toast hidden" id="toast"></div>

<footer>
  <div class="footer-text">
    Captain's Terps Grows
    <span class="sep">&middot;</span>
    MN Legal
    <span class="sep">&middot;</span>
    Personal Use Only
    <span class="sep">&middot;</span>
    Research powered by Claude AI
  </div>
</footer>

<script>
  'use strict';

  let allStrains    = [];
  let researchCache = {};
  let currentFilter = 'all';
  let currentId     = null;

  // ── Init ────────────────────────────────────────────────
  async function init() {
    try {
      const res  = await fetch('/api/strains');
      const data = await res.json();
      allStrains = data.strains || [];
      renderGrid();
    } catch (e) {
      document.getElementById('strain-grid').innerHTML =
        `<div class="empty-state"><div class="empty-glyph">⚠️</div>
         <div class="empty-text">Could not reach server. Is the app running?</div></div>`;
    }
  }

  // ── Grid rendering ──────────────────────────────────────
  function renderGrid() {
    const grid   = document.getElementById('strain-grid');
    const countEl = document.getElementById('strain-count');

    let strains = currentFilter === 'all'
      ? allStrains
      : allStrains.filter(s => s.status === currentFilter);

    countEl.textContent = `${strains.length} strain${strains.length !== 1 ? 's' : ''}`;

    if (!strains.length) {
      grid.innerHTML =
        `<div class="empty-state">
           <div class="empty-glyph">🌱</div>
           <div class="empty-text">No ${currentFilter !== 'all' ? currentFilter + ' ' : ''}strains yet.</div>
         </div>`;
      return;
    }

    grid.innerHTML = strains.map(s => {
      const sc  = s.status.replace(' ', '-');
      const res = researchCache[s.id];
      return `
        <div class="strain-card" onclick="openDetail('${s.id}')">
          <div class="card-top">
            <div>
              <div class="card-name">${esc(s.name)}</div>
              <div class="card-breeder">${esc(s.breeder)}</div>
            </div>
            <span class="status-tag ${sc}">${esc(s.status)}</span>
          </div>
          ${s.notes ? `<div class="card-notes">${esc(s.notes)}</div>` : ''}
          <div class="card-footer">
            <span class="card-date">${s.added}</span>
            ${res ? `<span class="card-researched">✦ Researched</span>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  // ── Detail modal ────────────────────────────────────────
  async function openDetail(id) {
    currentId = id;
    const strain = allStrains.find(s => s.id === id);
    if (!strain) return;

    document.getElementById('modal-name').textContent    = strain.name;
    document.getElementById('modal-breeder').textContent = strain.breeder;

    const tag = document.getElementById('modal-status-tag');
    tag.textContent = strain.status;
    tag.className   = `status-tag ${strain.status.replace(' ', '-')}`;

    document.getElementById('modal-status-select').value = strain.status;

    showOverlay('detail-modal');

    if (researchCache[id]) {
      renderResearch(researchCache[id], strain);
      return;
    }

    setModalBody(`<div class="loading-panel"><div class="spinner"></div>
      <div class="loading-text">Loading…</div></div>`);

    try {
      const res  = await fetch(`/api/research/${id}`);
      const data = await res.json();
      if (data && data.genetics_lineage) {
        researchCache[id] = data;
        renderResearch(data, strain);
        renderGrid();
      } else {
        showGeneratePanel(strain);
      }
    } catch {
      showGeneratePanel(strain);
    }
  }

  function closeDetailModal() {
    hideOverlay('detail-modal');
    document.getElementById('research-tabs').classList.add('hidden');
    currentId = null;
  }

  function setModalBody(html) {
    document.getElementById('research-tabs').classList.add('hidden');
    document.getElementById('modal-body').innerHTML = html;
  }

  function showGeneratePanel(strain) {
    setModalBody(`
      <div class="generate-panel">
        <div class="generate-glyph">🔬</div>
        <div class="generate-title">No research yet</div>
        <div class="generate-desc">
          Generate a full profile for <strong style="color:var(--text)">${esc(strain.name)}</strong>
          covering genetics, terpenes, effects, grow notes, and rosin extraction.
        </div>
        <button class="btn-generate" id="gen-btn" onclick="generateResearch()">
          ✦ &nbsp;Generate Research
        </button>
      </div>
      <div style="padding:0 1.6rem 1.5rem; border-top:1px solid var(--border); padding-top:1.25rem">
        <div class="form-group" style="gap:.45rem">
          <label class="form-label">My Notes</label>
          <textarea class="notes-textarea" id="notes-standalone"
            placeholder="Personal notes, grow observations, acquisition info…">${esc(strain.notes || '')}</textarea>
          <div class="notes-actions">
            <button class="btn btn-outline" onclick="saveNotes()">Save Notes</button>
          </div>
        </div>
      </div>`);
  }

  function renderResearch(r, strain) {
    const tabs    = document.getElementById('research-tabs');
    const body    = document.getElementById('modal-body');
    const genDate = r.generated_at
      ? new Date(r.generated_at).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' })
      : '—';

    const sections = [
      { id:'genetics', icon:'🧬', title:'Genetics & Lineage',   key:'genetics_lineage'  },
      { id:'terpenes', icon:'🌿', title:'Terpene Profile',      key:'terpene_profile'   },
      { id:'effects',  icon:'✨', title:'Effects',              key:'effects'           },
      { id:'flavor',   icon:'👃', title:'Flavor & Aroma',       key:'flavor_aroma'      },
      { id:'grow',     icon:'🪴', title:'Grow Notes',           key:'grow_notes'        },
      { id:'rosin',    icon:'🍯', title:'Rosin & Extraction',   key:'rosin_extraction'  },
    ];

    let html = sections.map(s => `
      <div class="research-panel${s.id === 'genetics' ? ' active' : ''}" id="panel-${s.id}">
        <div class="section-title">${s.icon}&nbsp;${s.title}</div>
        <div class="research-text">${esc(r[s.key] || '—')}</div>
        ${s.id === 'rosin' ? `<div class="research-meta">Generated ${genDate} · Claude AI</div>` : ''}
      </div>`).join('');

    html += `
      <div class="research-panel" id="panel-notes">
        <div class="section-title">📝&nbsp;My Notes</div>
        <textarea class="notes-textarea" id="notes-main"
          placeholder="Personal grow notes, observations…">${esc(strain.notes || '')}</textarea>
        <div class="notes-actions">
          <button class="btn btn-outline" onclick="saveNotes()">Save Notes</button>
        </div>
      </div>`;

    body.innerHTML = html;

    tabs.classList.remove('hidden');
    tabs.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    tabs.querySelector('[data-tab="genetics"]').classList.add('active');
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll('.research-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    const panel = document.getElementById(`panel-${tabId}`);
    if (panel) panel.classList.add('active');
    btn.classList.add('active');
  }

  // ── Generate research ────────────────────────────────────
  async function generateResearch() {
    if (!currentId) return;
    const strain = allStrains.find(s => s.id === currentId);

    setModalBody(`
      <div class="loading-panel">
        <div class="spinner"></div>
        <div class="loading-text">Claude is researching ${esc(strain?.name || 'this strain')}…</div>
        <div class="loading-sub">Pulling genetics, terpenes, grow notes &amp; extraction data</div>
      </div>`);

    try {
      const res = await fetch(`/api/research/${currentId}`, { method: 'POST' });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      researchCache[currentId] = data;
      renderResearch(data, strain);
      renderGrid();
      toast('Research generated ✦');
    } catch (e) {
      setModalBody(`
        <div class="generate-panel">
          <div class="generate-glyph">⚠️</div>
          <div class="generate-title">Research failed</div>
          <div class="generate-desc">${esc(e.message)}</div>
          <button class="btn-generate" onclick="generateResearch()">Try Again</button>
        </div>`);
    }
  }

  // ── Status update ────────────────────────────────────────
  async function updateStatus() {
    if (!currentId) return;
    const newStatus = document.getElementById('modal-status-select').value;

    try {
      const res = await fetch(`/api/strains/${currentId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      });
      if (!res.ok) throw new Error();
      const idx = allStrains.findIndex(s => s.id === currentId);
      if (idx !== -1) allStrains[idx].status = newStatus;

      const tag = document.getElementById('modal-status-tag');
      tag.textContent = newStatus;
      tag.className   = `status-tag ${newStatus.replace(' ', '-')}`;

      renderGrid();
      toast('Status updated');
    } catch {
      toast('Failed to update status');
    }
  }

  // ── Save notes ───────────────────────────────────────────
  async function saveNotes() {
    if (!currentId) return;
    const el = document.getElementById('notes-main') || document.getElementById('notes-standalone');
    if (!el) return;
    const notes  = el.value;
    const strain = allStrains.find(s => s.id === currentId);
    if (!strain) return;

    try {
      await fetch(`/api/strains/${currentId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: strain.status, notes }),
      });
      strain.notes = notes;
      renderGrid();
      toast('Notes saved');
    } catch {
      toast('Failed to save notes');
    }
  }

  // ── Delete strain ────────────────────────────────────────
  function confirmDelete() {
    if (!currentId) return;
    const strain = allStrains.find(s => s.id === currentId);
    if (!confirm(`Delete "${strain?.name}"? This cannot be undone.`)) return;
    deleteStrain();
  }

  async function deleteStrain() {
    if (!currentId) return;
    try {
      const res = await fetch(`/api/strains/${currentId}`, { method: 'DELETE' });
      if (!res.ok) throw new Error();
      allStrains = allStrains.filter(s => s.id !== currentId);
      delete researchCache[currentId];
      closeDetailModal();
      renderGrid();
      toast('Strain removed');
    } catch {
      toast('Failed to delete strain');
    }
  }

  // ── Add strain modal ─────────────────────────────────────
  function openAddModal()  { showOverlay('add-modal'); }
  function closeAddModal() { hideOverlay('add-modal'); document.getElementById('add-form').reset(); }

  async function submitAddStrain(e) {
    e.preventDefault();
    const form = e.target;
    const body = {
      name:    form.name.value.trim(),
      breeder: form.breeder.value.trim(),
      status:  form.status.value,
      notes:   form.notes.value.trim(),
    };
    try {
      const res   = await fetch('/api/strains', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const newS  = await res.json();
      allStrains.push(newS);
      renderGrid();
      closeAddModal();
      toast(`"${newS.name}" added`);
    } catch {
      toast('Failed to add strain');
    }
  }

  // ── Modal helpers ────────────────────────────────────────
  function showOverlay(id) {
    document.getElementById(id).classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function hideOverlay(id) {
    document.getElementById(id).classList.add('hidden');
    const anyOpen = ['detail-modal','add-modal']
      .some(mid => !document.getElementById(mid).classList.contains('hidden'));
    if (!anyOpen) document.body.style.overflow = '';
  }

  document.getElementById('detail-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeDetailModal();
  });
  document.getElementById('add-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeAddModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('detail-modal').classList.contains('hidden')) closeDetailModal();
    else if (!document.getElementById('add-modal').classList.contains('hidden')) closeAddModal();
  });

  // ── Toast ────────────────────────────────────────────────
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
  }

  // ── Escape HTML ──────────────────────────────────────────
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
